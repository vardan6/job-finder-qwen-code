<!-- Partial rendered into #generated-document-{{ document_type }} via htmx swap -->
<div id="generated-document-{{ document_type }}">
    {% if error %}
    <div class="alert alert-warning mb-2">
        <i class="bi bi-exclamation-triangle"></i> {{ error }}
    </div>
    {% endif %}

    {% if generated %}
    <div class="border rounded p-2 mb-2">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <small class="text-muted">
                {% if generated.llm_model_name %}
                Generated with {{ generated.llm_provider_name }} / {{ generated.llm_model_name }}
                {% endif %}
            </small>
            <div>
                <a class="btn btn-sm btn-outline-secondary"
                   href="/jobs/{{ job.id }}/generated-document/{{ document_type }}/download">
                    <i class="bi bi-download"></i> Download
                </a>
                <button class="btn btn-sm btn-outline-primary"
                        hx-post="/jobs/{{ job.id }}/generate-document/{{ document_type }}"
                        hx-target="#generated-document-{{ document_type }}"
                        hx-swap="outerHTML"
                        hx-indicator="#generating-{{ document_type }}">
                    <i class="bi bi-arrow-clockwise"></i> Regenerate
                </button>
            </div>
        </div>
        <pre class="generated-document-content">{{ generated.content }}</pre>
    </div>
    {% endif %}
</div>
