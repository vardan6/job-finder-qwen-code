{% extends "base.html" %}

{% block title %}Tool Registry - Job Finder{% endblock %}

{% block content %}
<div class="container">
    <h1><i class="bi bi-tools"></i> Tool Registry</h1>
    <p class="lead">Tools currently available to the AI agent runtime, read-only.</p>

    <div id="tools-status" class="text-muted mb-3">Loading tools…</div>
    <div id="tools-list" class="row g-3"></div>
</div>

<script>
(async function () {
    const statusEl = document.getElementById('tools-status');
    const listEl = document.getElementById('tools-list');

    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value == null ? '' : String(value);
        return div.innerHTML;
    }

    try {
        const response = await fetch('/api/ai/tools');
        if (!response.ok) {
            throw new Error('Failed to load tool registry.');
        }
        const data = await response.json();
        const tools = Array.isArray(data.tools) ? data.tools : [];
        statusEl.textContent = `${tools.length} tool(s) registered.`;

        listEl.innerHTML = tools.map((tool) => {
            const params = tool.params && Object.keys(tool.params).length
                ? Object.entries(tool.params).map(([name, type]) => `<code>${escapeHtml(name)}: ${escapeHtml(type)}</code>`).join(', ')
                : '<span class="text-muted">none</span>';
            const modeBadge = tool.mode === 'write'
                ? '<span class="badge text-bg-warning">write</span>'
                : '<span class="badge text-bg-secondary">read</span>';
            return `
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <h2 class="h6 mb-1">${escapeHtml(tool.name)}</h2>
                                ${modeBadge}
                            </div>
                            <p class="mb-2">${escapeHtml(tool.description || '')}</p>
                            <div class="small text-muted">Params: ${params}</div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    } catch (error) {
        statusEl.textContent = error.message || 'Could not load the tool registry.';
    }
})();
</script>
{% endblock %}
